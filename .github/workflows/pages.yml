name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - run: |
          mkdir _site && cp index.html manifest.webmanifest sw.js *.png icon.svg _site/ && cp -r vendor fonts sounds img courses _site/
          sed -i "s/__BUILD__/${GITHUB_SHA}/" _site/index.html _site/sw.js
          echo "${GITHUB_SHA}" > _site/version.txt
          python3 tools/course_text.py _site/courses/courses.json   # the play page descriptions are edited by hand in course_descriptions.txt
          python3 tools/pages_hashes.py _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}   # one name per attempt: "Re-run failed jobs" adds a second artifact to the same run
      # GitHub sometimes loses the publish step ("No artifacts named ..."): try once more after a pause; only the retry's failure fails the run
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
