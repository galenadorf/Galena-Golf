name: Approve player
# Run by hand (Actions > Approve player > Run workflow; only people with write access to the repo can): turns a "[register]" issue, filed from
# Settings > Player ID > Request ID in the game, into a device key in players.json. "to" is "new" (a new player, named as requested) or an
# existing ID such as P003 (the reserved player, or a second device for someone already registered). The issue is only data: the key in it is
# checked to be a P-256 public key, and the run itself is the approval. Reject a request by closing its issue.
on:
  workflow_dispatch:
    inputs:
      issue:
        description: 'Number of the [register] issue'
        required: true
      to:
        description: 'new, or an existing ID (P001, P002, ...)'
        required: true
        default: 'new'
permissions:
  contents: write
  issues: write
concurrency:
  group: roster
  cancel-in-progress: false
jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/github-script@v7
        env:
          ISSUE: ${{ inputs.issue }}
          TO: ${{ inputs.to }}
        with:
          script: |
            const fs = require('fs');
            const num = parseInt(process.env.ISSUE, 10), to = String(process.env.TO).trim();
            const fail = m => { core.setFailed(m); };
            const issue = (await github.rest.issues.get({ ...context.repo, issue_number: num })).data;
            if (!issue.title.startsWith('[register]') || issue.pull_request) return fail('That is not a [register] issue.');
            const m = /```json\s*([\s\S]*?)```/.exec(issue.body || '');
            let q; try { q = JSON.parse(m[1]); } catch (e) { return fail('No request JSON in that issue.'); }
            const SPKI = '3059301306072a8648ce3d020106082a8648ce3d030107034200', raw = typeof q.k === 'string' ? Buffer.from(q.k, 'base64') : Buffer.alloc(0);
            if (raw.length !== 91 || !raw.toString('hex').startsWith(SPKI) || raw[26] !== 4) return fail('That is not a P-256 public key.');
            const label = String(q.l || 'Device').replace(/[^\p{L}\p{N} ._-]/gu, '').slice(0, 24) || 'Device';
            let players = []; try { players = JSON.parse(fs.readFileSync('players.json', 'utf8')); } catch (e) { }
            if (players.some(p => p.keys.some(k => k.k === q.k))) { await github.rest.issues.update({ ...context.repo, issue_number: num, state: 'closed', state_reason: 'completed' }); return core.notice('Already registered.'); }
            let p;
            if (to === 'new') {
              const name = String(q.name || '').replace(/\s+/g, ' ').trim();
              if (!/^[\p{L}\p{N} ._'-]{1,14}$/u.test(name)) return fail('The requested name is not valid.');
              if (players.some(x => x.name.toLowerCase() === name.toLowerCase())) return fail('That name is taken: approve it to that player ID instead.');
              p = { id: 'P' + String(1 + Math.max(0, ...players.map(x => parseInt(x.id.slice(1), 10)))).padStart(3, '0'), name, keys: [] }; players.push(p);
            } else {
              p = players.find(x => x.id === to); if (!p) return fail('No player ' + to + '.');
            }
            p.keys.push({ k: q.k, label });
            fs.writeFileSync('players.json', JSON.stringify(players, null, 1) + '\n');
            await exec.exec('git', ['config', 'user.name', 'github-actions[bot]']); await exec.exec('git', ['config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com']);
            await exec.exec('git', ['add', 'players.json']); await exec.exec('git', ['commit', '-m', `Roster: ${p.id} ${p.name} gets ${label}`]);
            for (let k = 0; k < 4; k++) { try { await exec.exec('git', ['push', 'origin', 'HEAD:main']); break; } catch (e) { await exec.exec('git', ['pull', '--rebase', 'origin', 'main']); } }
            await github.rest.issues.createComment({ ...context.repo, issue_number: num, body: `✅ Approved as ${p.id} ${p.name} (${label}).` });
            await github.rest.issues.update({ ...context.repo, issue_number: num, state: 'closed', state_reason: 'completed' });
